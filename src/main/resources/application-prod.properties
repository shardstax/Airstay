# Production.
# One JSON object per log line (Elastic Common Schema), ready for CloudWatch / ELK.
logging.structured.format.console=ecs
# Behind a load balancer / reverse proxy: trust X-Forwarded-* so redirects and URLs use https.
server.forward-headers-strategy=framework
# API docs stay on for the public demo; set API_DOCS_ENABLED=false to hide them.
springdoc.api-docs.enabled=${API_DOCS_ENABLED:true}
springdoc.swagger-ui.enabled=${API_DOCS_ENABLED:true}
