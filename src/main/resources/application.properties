spring.application.name=airstay

# Database (PostgreSQL). Schema is owned by Flyway; Hibernate only validates it.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
# Release the database connection when the service-layer transaction ends instead of holding it until the HTTP
# response is written. All lazy loading happens inside @Transactional service methods.
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

server.servlet.context-path=/api/v1

# Redis: an optional accelerator (search cache, rate limiting), never the source of truth. Every use fails open:
# if Redis is down the app falls back to PostgreSQL (cache) or allows the request (rate limiter), and a circuit
# breaker (RedisGate) stops a dead Redis from slowing requests. Short timeouts keep a failure cheap.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=200ms
spring.data.redis.connect-timeout=500ms
# Redis being down must not mark the whole app unhealthy: it keeps serving from PostgreSQL.
management.health.redis.enabled=false

# Rate limiting: Redis counters shared by every app instance. Fails open if Redis is down. RATE_LIMIT_ENABLED=false
# turns it off. Behind a proxy the client address needs server.forward-headers-strategy (set in the prod profile).
airstay.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
airstay.rate-limit.login-per-email.limit=10
airstay.rate-limit.login-per-email.window=1m
airstay.rate-limit.login-per-ip.limit=30
airstay.rate-limit.login-per-ip.window=1m
airstay.rate-limit.signup-per-ip.limit=10
airstay.rate-limit.signup-per-ip.window=1m
airstay.rate-limit.booking-init-per-user.limit=20
airstay.rate-limit.booking-init-per-user.window=1m

# Search results cache. Staleness is bounded by the TTL. Booking never reads the cache (it locks the inventory rows in
# PostgreSQL), so a stale result can at worst list a hotel that then answers 409. SEARCH_CACHE_ENABLED=false turns it off.
airstay.search-cache.enabled=${SEARCH_CACHE_ENABLED:true}
airstay.search-cache.ttl=30s
airstay.search-cache.ttl-jitter=0.2

# Health checks for Docker / load balancers: /api/v1/actuator/health (includes the database),
# plus /liveness and /readiness probes. Details are hidden from anonymous callers.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# Security
jwt.secretKey=${JWT_SECRET_KEY}
airstay.security.refresh-cookie.secure=${REFRESH_COOKIE_SECURE:true}
airstay.security.refresh-cookie.same-site=${REFRESH_COOKIE_SAME_SITE:Strict}
airstay.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Payments
frontend.url=${FRONTEND_URL:http://localhost:5173}
stripe.secret.key=${STRIPE_SECRET_KEY}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET}

# Booking holds: a reservation holds inventory for this long before guests and payment are done.
# Once payment starts, the Stripe session lives 31 minutes and the hold is extended to cover it.
airstay.booking.reservation-hold-minutes=10
airstay.booking.payment-hold-minutes=35
airstay.booking.stripe-session-minutes=31
airstay.booking.expiry-check-interval-ms=60000
airstay.booking.max-nights=30

# Pricing: comma-separated ISO dates that get the holiday multiplier.
airstay.pricing.holidays=${PRICING_HOLIDAYS:2026-12-25,2026-12-31,2027-01-01,2027-01-26,2027-08-15,2027-10-02}
