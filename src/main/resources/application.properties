spring.application.name=airstay

# Database (PostgreSQL). Schema is owned by Flyway; Hibernate only validates it.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
# Release the database connection when the service-layer transaction ends instead of holding it until the HTTP
# response is written. All lazy loading happens inside @Transactional service methods.
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

server.servlet.context-path=/api/v1

# Redis: an optional accelerator (search cache, rate limiting), never the source of truth. Every use fails open:
# if Redis is down the app falls back to PostgreSQL (cache) or allows the request (rate limiter), and a circuit
# breaker (RedisGate) stops a dead Redis from slowing requests. Short timeouts keep a failure cheap.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=200ms
spring.data.redis.connect-timeout=500ms
# Redis being down must not mark the whole app unhealthy: it keeps serving from PostgreSQL.
management.health.redis.enabled=false

# Kafka: events to other services and AirStay's own refund worker. Bookings NEVER depend on it: every event is saved in
# PostgreSQL (the outbox table) in the booking's own transaction, and OutboxRelay publishes it when Kafka is reachable.
# Short producer timeouts keep a Kafka outage cheap (the relay gives up after a few seconds and tries again later).
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.admin.fail-fast=false
spring.kafka.admin.operation-timeout=5s
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.block.ms=2000
spring.kafka.producer.properties.request.timeout.ms=2000
spring.kafka.producer.properties.delivery.timeout.ms=5000
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false
# The default scheduler has ONE thread: a relay waiting on Kafka must never delay the expiry or pricing jobs.
spring.task.scheduling.pool.size=4
airstay.events.enabled=${EVENTS_ENABLED:true}
airstay.events.relay-interval-ms=500
airstay.events.batch-size=100
airstay.events.send-timeout-ms=5000
airstay.events.retention-days=7
# Refund worker: a failed refund is retried through retry topics (not by blocking the consumer): 6 attempts in total with
# delays of 10 s, 30 s, 90 s, 270 s, 600 s, about 17 minutes in all, then the message goes to airstay.refund-requests.DLT.
airstay.events.refund-attempts=6
airstay.events.refund-retry-delay-ms=10000
airstay.events.refund-retry-multiplier=3.0
airstay.events.refund-retry-max-delay-ms=600000

# Rate limiting: Redis counters shared by every app instance. Fails open if Redis is down. RATE_LIMIT_ENABLED=false
# turns it off. Behind a proxy the client address needs server.forward-headers-strategy (set in the prod profile).
airstay.rate-limit.enabled=${RATE_LIMIT_ENABLED:true}
airstay.rate-limit.login-per-email.limit=10
airstay.rate-limit.login-per-email.window=1m
airstay.rate-limit.login-per-ip.limit=30
airstay.rate-limit.login-per-ip.window=1m
airstay.rate-limit.signup-per-ip.limit=10
airstay.rate-limit.signup-per-ip.window=1m
airstay.rate-limit.booking-init-per-user.limit=20
airstay.rate-limit.booking-init-per-user.window=1m
airstay.rate-limit.places-per-ip.limit=120
airstay.rate-limit.places-per-ip.window=1m

# Search results cache. Staleness is bounded by the TTL. Booking never reads the cache (it locks the inventory rows in
# PostgreSQL), so a stale result can at worst list a hotel that then answers 409. SEARCH_CACHE_ENABLED=false turns it off.
airstay.search-cache.enabled=${SEARCH_CACHE_ENABLED:true}
airstay.search-cache.ttl=30s
airstay.search-cache.ttl-jitter=0.2

# Health checks for Docker / load balancers: /api/v1/actuator/health (includes the database),
# plus /liveness and /readiness probes. Details are hidden from anonymous callers.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# Security
jwt.secretKey=${JWT_SECRET_KEY}
airstay.security.refresh-cookie.secure=${REFRESH_COOKIE_SECURE:true}
airstay.security.refresh-cookie.same-site=${REFRESH_COOKIE_SAME_SITE:Strict}
airstay.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Payments
frontend.url=${FRONTEND_URL:http://localhost:5173}
stripe.secret.key=${STRIPE_SECRET_KEY}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET}

# Booking holds: a reservation holds inventory for this long before guests and payment are done.
# Once payment starts, the Stripe session lives 31 minutes and the hold is extended to cover it.
airstay.booking.reservation-hold-minutes=10
airstay.booking.payment-hold-minutes=35
airstay.booking.stripe-session-minutes=31
airstay.booking.expiry-check-interval-ms=60000
airstay.booking.max-nights=30

# Idempotency-Key header on POST /bookings/init: keys are kept this long, then a scheduled job deletes them.
airstay.idempotency.retention-hours=24
airstay.idempotency.cleanup-interval-ms=3600000

# Pricing: comma-separated ISO dates that get the holiday multiplier.
airstay.pricing.holidays=${PRICING_HOLIDAYS:2026-12-25,2026-12-31,2027-01-01,2027-01-26,2027-08-15,2027-10-02}
# How often stored prices are refreshed (Spring cron, hourly by default). The load tests set it to every minute to time it.
airstay.pricing.refresh-cron=${PRICING_REFRESH_CRON:0 0 * * * *}

# NEVER in production. Replaces Stripe with an in-memory fake so a load test can run the whole booking flow without a
# Stripe account. The application refuses to start with this and the prod profile. See FakeCheckoutService.
airstay.payments.fake=${PAYMENTS_FAKE:false}

# Places: hotels are placed in real cities chosen from a geocoding provider (Open-Meteo, free, no key; data from GeoNames,
# CC BY 4.0). Searches and lookups are cached for a day. PLACES_PROVIDER=synthetic is for tests and load tests ONLY: it
# accepts any place id, and the application refuses to start with it and the prod profile.
airstay.places.provider=${PLACES_PROVIDER:open-meteo}
airstay.places.base-url=${PLACES_BASE_URL:https://geocoding-api.open-meteo.com}
airstay.places.cache-ttl=24h
airstay.places.max-results=8
