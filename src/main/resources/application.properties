spring.application.name=airstay

# Database (PostgreSQL). Schema is owned by Flyway; Hibernate only validates it.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

server.servlet.context-path=/api/v1

# Health checks for Docker / load balancers: /api/v1/actuator/health (includes the database),
# plus /liveness and /readiness probes. Details are hidden from anonymous callers.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never

# Security
jwt.secretKey=${JWT_SECRET_KEY}
airstay.security.refresh-cookie.secure=${REFRESH_COOKIE_SECURE:true}
airstay.security.refresh-cookie.same-site=${REFRESH_COOKIE_SAME_SITE:Strict}
airstay.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Payments
frontend.url=${FRONTEND_URL:http://localhost:5173}
stripe.secret.key=${STRIPE_SECRET_KEY}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET}

# Booking holds: a reservation holds inventory for this long before guests and payment are done.
# Once payment starts, the Stripe session lives 31 minutes and the hold is extended to cover it.
airstay.booking.reservation-hold-minutes=10
airstay.booking.payment-hold-minutes=35
airstay.booking.stripe-session-minutes=31
airstay.booking.expiry-check-interval-ms=60000
airstay.booking.max-nights=30

# Pricing: comma-separated ISO dates that get the holiday multiplier.
airstay.pricing.holidays=${PRICING_HOLIDAYS:2026-12-25,2026-12-31,2027-01-01,2027-01-26,2027-08-15,2027-10-02}
