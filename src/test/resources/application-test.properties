# Test profile. The database itself comes from Testcontainers (@ServiceConnection overrides these URLs).
spring.datasource.url=jdbc:postgresql://overridden-by-testcontainers/airstay
spring.datasource.username=test
spring.datasource.password=test

jwt.secretKey=integration-test-secret-key-that-is-long-enough-for-hs256
stripe.secret.key=sk_test_not_used_checkout_is_mocked
stripe.webhook.secret=whsec_integration_test_secret

# Production uses tight Redis timeouts (200 ms) so a dead Redis fails fast. Tests connect to a freshly started container
# through Docker, where the very first connection can be slower, so they get generous ones.
spring.data.redis.timeout=3s
spring.data.redis.connect-timeout=5s

# Tests create many users and book from one address and one user, so the per-address and per-user rules are effectively
# off. Per-e-mail login limits stay at the default because every test uses fresh e-mails. RateLimiterIT tightens rules.
airstay.rate-limit.login-per-ip.limit=100000
airstay.rate-limit.signup-per-ip.limit=100000
airstay.rate-limit.booking-init-per-user.limit=100000

# The search cache is off by default so tests see data changes immediately; SearchCacheIT switches it on.
airstay.search-cache.enabled=false

# Deterministic prices: no holiday surcharges
airstay.pricing.holidays=
# Tests trigger the expiry job directly instead of waiting for the schedule
airstay.booking.expiry-check-interval-ms=3600000
airstay.security.refresh-cookie.secure=false

logging.level.org.hibernate.SQL=warn
