# Test profile. The database itself comes from Testcontainers (@ServiceConnection overrides these URLs).
spring.datasource.url=jdbc:postgresql://overridden-by-testcontainers/airstay
spring.datasource.username=test
spring.datasource.password=test

jwt.secretKey=integration-test-secret-key-that-is-long-enough-for-hs256
stripe.secret.key=sk_test_not_used_checkout_is_mocked
stripe.webhook.secret=whsec_integration_test_secret

# Deterministic prices: no holiday surcharges
airstay.pricing.holidays=
# Tests trigger the expiry job directly instead of waiting for the schedule
airstay.booking.expiry-check-interval-ms=3600000
airstay.security.refresh-cookie.secure=false

logging.level.org.hibernate.SQL=warn
