# Serves the single-page app and forwards /api to the backend, so the browser only ever talks to one origin.
# That keeps the refresh-token cookie (SameSite=Strict, path /api/v1/auth) first-party and needs no CORS.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # The API. A variable in proxy_pass is resolved at request time, so Nginx still starts when the app is not up yet;
    # with no URI part the original path and query string are forwarded unchanged (so the cookie path still matches).
    location /api/ {
        client_max_body_size 3m;
        resolver ${AIRSTAY_DNS_RESOLVERS} valid=10s;
        set $backend ${AIRSTAY_API_UPSTREAM};
        proxy_pass $backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto ${AIRSTAY_FORWARDED_PROTO};
        proxy_read_timeout 60s;
    }

    # Hashed build files never change: cache them for a year.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Everything else is the single-page app: index.html must always be re-checked.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri /index.html;
    }
}
