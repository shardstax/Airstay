# Security headers for everything Nginx serves itself (the web app). Included in each location that serves files:
# Nginx drops server-level add_header lines in any location that defines its own, so they are never set at server level.
# Not used for /api/: the backend sets its own headers, and a page-level CSP would break its Swagger UI.
#
# Stripe Checkout is reached by a full-page redirect, so the app loads nothing third-party.
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: https:; style-src 'self'; script-src 'self'; connect-src 'self'; font-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
