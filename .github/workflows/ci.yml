name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Unit tests, then integration tests against PostgreSQL in Docker (Testcontainers), then coverage.
      - name: Build and verify
        run: ./mvnw -B -ntp verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports
            target/failsafe-reports

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco
          if-no-files-found: ignore

      - name: Coverage summary
        if: always()
        run: |
          if [ -f target/site/jacoco/jacoco.csv ]; then
            awk -F, 'NR>1 { missed+=$8; covered+=$9 } END { if (missed+covered>0) printf "Line coverage: %.1f%%\n", 100*covered/(missed+covered) }' \
              target/site/jacoco/jacoco.csv | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  notification-service:
    name: Notification service build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: notification-service/pom.xml

      # A separate Maven project. Unit tests, then integration tests with Kafka and Redis in Docker (Testcontainers)
      # and an in-process SMTP server. The contract test reads docs/events.md from the repository root.
      - name: Build and verify
        run: ./mvnw -B -ntp -f notification-service/pom.xml verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: notification-service-test-reports
          path: |
            notification-service/target/surefire-reports
            notification-service/target/failsafe-reports

      - name: Coverage summary
        if: always()
        run: |
          if [ -f notification-service/target/site/jacoco/jacoco.csv ]; then
            awk -F, 'NR>1 { missed+=$8; covered+=$9 } END { if (missed+covered>0) printf "Notification service line coverage: %.1f%%\n", 100*covered/(missed+covered) }' \
              notification-service/target/site/jacoco/jacoco.csv | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  frontend:
    name: Frontend typecheck, test and build
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Strict TypeScript, unit and component tests, then a production build. Whether the generated API types still match the
      # backend is checked in the docker job below, where a running backend exists.
      - name: Install, typecheck, test, build
        working-directory: frontend
        run: |
          npm ci --no-audit --no-fund
          npm run typecheck
          npm test
          npm run build

      - name: Bundle size
        working-directory: frontend
        run: |
          echo "Frontend build (JS + CSS, uncompressed / gzip):" | tee -a "$GITHUB_STEP_SUMMARY"
          for ext in js css; do
            raw=$(cat dist/assets/*.$ext | wc -c); gz=$(cat dist/assets/*.$ext | gzip -9 | wc -c)
            echo "- $ext: $raw / $gz bytes" | tee -a "$GITHUB_STEP_SUMMARY"
          done

  docker:
    name: Docker images and compose smoke test
    needs: [build, notification-service, frontend]
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      # Builds both images and starts PostgreSQL, Redis, Kafka, Mailpit, the app and the notification service;
      # --wait fails the step unless every health check passes.
      - name: Start the stack
        run: docker compose up --build --detach --wait --wait-timeout 400

      - name: Smoke test the API
        run: |
          B=http://localhost:8080/api/v1
          curl -fsS "$B/actuator/health" | grep -q '"status":"UP"'
          curl -fsS -o /dev/null -X POST "$B/auth/signup" -H 'Content-Type: application/json' \
            -d '{"email":"ci@example.com","password":"Password123!","name":"CI"}'
          curl -fsS -X POST "$B/auth/login" -H 'Content-Type: application/json' \
            -d '{"email":"ci@example.com","password":"Password123!"}' | grep -q accessToken
          test "$(curl -s -o /dev/null -w '%{http_code}' "$B/users/profile")" = "401"
          echo "Image size (API): $(docker image inspect airstay:local --format '{{.Size}}' | numfmt --to=iec)" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "Image size (notification service): $(docker image inspect airstay-notification-service:local --format '{{.Size}}' | numfmt --to=iec)" | tee -a "$GITHUB_STEP_SUMMARY"

      # The whole event chain with real components: a booking is confirmed by a signed Stripe webhook, goes through
      # the outbox and Kafka to the notification service, and the e-mail shows up in Mailpit; then the same for a cancellation.
      - name: Smoke test the event chain (webhook, outbox, Kafka, e-mail)
        run: bash scripts/smoke-events.sh

      # The web app is served by Nginx, which forwards /api to the backend: one origin for the browser.
      - name: Smoke test the frontend
        run: |
          curl -fsS http://localhost:5173/ | grep -q '<div id="root">'
          curl -fsS http://localhost:5173/api/v1/actuator/health | grep -q '"status":"UP"'
          test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:5173/design)" = "200"
          echo "Image size (frontend): $(docker image inspect airstay-frontend:local --format '{{.Size}}' | numfmt --to=iec)" | tee -a "$GITHUB_STEP_SUMMARY"

      # The API types in frontend/src/api/schema.d.ts are generated from the backend's OpenAPI spec. If the backend changed
      # and the file was not regenerated, this fails and shows the difference.
      - name: Check the generated API types are current
        run: |
          docker run --rm --network airstay_default -v "$PWD/frontend":/app -w /app \
            -e OPENAPI_URL=http://app:8080/api/v1/v3/api-docs node:22-alpine \
            sh -c 'npm ci --no-audit --no-fund && npm run -s api:check'

      - name: Logs on failure
        if: failure()
        run: |
          docker compose ps
          for service in app notification-service kafka; do
            echo "::group::$service"
            docker compose logs --tail 200 "$service"
            echo "::endgroup::"
          done

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
