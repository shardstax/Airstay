name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # Unit tests, then integration tests against PostgreSQL in Docker (Testcontainers), then coverage.
      - name: Build and verify
        run: ./mvnw -B -ntp verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            target/surefire-reports
            target/failsafe-reports

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco
          if-no-files-found: ignore

      - name: Coverage summary
        if: always()
        run: |
          if [ -f target/site/jacoco/jacoco.csv ]; then
            awk -F, 'NR>1 { missed+=$8; covered+=$9 } END { if (missed+covered>0) printf "Line coverage: %.1f%%\n", 100*covered/(missed+covered) }' \
              target/site/jacoco/jacoco.csv | tee -a "$GITHUB_STEP_SUMMARY"
          fi

  docker:
    name: Docker image and compose smoke test
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      # Builds the image and starts app + PostgreSQL; --wait fails the step unless both health checks pass.
      - name: Start the stack
        run: docker compose up --build --detach --wait --wait-timeout 300

      - name: Smoke test the API
        run: |
          B=http://localhost:8080/api/v1
          curl -fsS "$B/actuator/health" | grep -q '"status":"UP"'
          curl -fsS -o /dev/null -X POST "$B/auth/signup" -H 'Content-Type: application/json' \
            -d '{"email":"ci@example.com","password":"Password123!","name":"CI"}'
          curl -fsS -X POST "$B/auth/login" -H 'Content-Type: application/json' \
            -d '{"email":"ci@example.com","password":"Password123!"}' | grep -q accessToken
          test "$(curl -s -o /dev/null -w '%{http_code}' "$B/users/profile")" = "401"
          echo "Image size: $(docker image inspect airstay:local --format '{{.Size}}' | numfmt --to=iec)" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: App logs on failure
        if: failure()
        run: docker compose logs app

      - name: Stop the stack
        if: always()
        run: docker compose down --volumes
