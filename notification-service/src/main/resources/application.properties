spring.application.name=airstay-notification-service
server.port=8081

# Kafka: consumes airstay.booking-events. Offsets are committed by the listener container only after a message was
# handled, so a crash re-delivers it (at-least-once; the e-mail step is made idempotent by the event id).
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.admin.fail-fast=false
spring.kafka.admin.operation-timeout=5s
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.enable-auto-commit=false

# Redis remembers which event ids were already e-mailed. Short timeouts: if Redis is down the service still works
# (it may then send a duplicate e-mail, never lose one).
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=200ms
spring.data.redis.connect-timeout=500ms

# SMTP (Mailpit in Docker Compose). Timeouts keep a dead mail server from blocking the consumer for long.
spring.mail.host=${SMTP_HOST:localhost}
spring.mail.port=${SMTP_PORT:1025}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Health is about THIS service. Redis or the mail server being down is handled by retries and must not make it look dead.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.health.redis.enabled=false
management.health.mail.enabled=false

airstay.notifications.from=AirStay <no-reply@airstay.local>
# How long a handled event id is remembered (duplicates inside this window are ignored).
airstay.notifications.dedup-ttl=7d
# A failed delivery is retried through retry topics (not by blocking the consumer): 5 attempts in total with delays of
# 5 s, 15 s, 45 s, 135 s, then the message goes to airstay.booking-events.notifications.DLT.
airstay.notifications.retry-attempts=5
airstay.notifications.retry-delay-ms=5000
airstay.notifications.retry-multiplier=3.0
airstay.notifications.retry-max-delay-ms=300000
