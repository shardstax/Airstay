# Production uses tight Redis timeouts (200 ms) so a dead Redis fails fast. Tests connect to a freshly started container
# through Docker, where the very first connection can be slower, so they get generous ones.
spring.data.redis.timeout=3s
spring.data.redis.connect-timeout=5s

# Retries in seconds instead of minutes: 5 attempts with delays of 0.5 s, 1 s, 2 s, 4 s (a failing e-mail reaches the
# dead-letter topic after about 7.5 s). The multiplier must be above 1.0 on purpose: like production it then gets one
# retry topic per attempt (...notifications.retry-0 to -3); a fixed delay would share a single "...notifications.retry".
airstay.notifications.retry-attempts=5
airstay.notifications.retry-delay-ms=500
airstay.notifications.retry-multiplier=2.0
airstay.notifications.retry-max-delay-ms=4000
