# Run the whole stack:          docker compose up --build
# With Stripe webhook forwarding: docker compose --profile stripe up --build
# Values come from .env (see .env.example); everything has a local-only default so it starts without one.

name: airstay

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: airstay
      POSTGRES_USER: airstay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-airstay}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Not published to the host by default; uncomment to connect with a SQL client.
    # ports:
    #   - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airstay -d airstay"]
      interval: 5s
      timeout: 3s
      retries: 20

  # A cache and counter store, never the source of truth: no persistence, bounded memory, least-recently-used eviction.
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Single-node Kafka in KRaft mode (no ZooKeeper). Carries booking events and refund requests; data lives in a volume.
  kafka:
    image: apache/kafka:3.9.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s

  app:
    build: .
    image: airstay:local
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/airstay
      SPRING_DATASOURCE_USERNAME: airstay
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-airstay}
      REDIS_HOST: redis
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SEARCH_CACHE_ENABLED: ${SEARCH_CACHE_ENABLED:-true}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-local-development-only-secret-change-me-0123456789}
      # Without real Stripe test keys everything works except taking payments.
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_not_configured}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-whsec_not_configured}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      PRICING_HOLIDAYS: ${PRICING_HOLIDAYS:-2026-12-25,2026-12-31,2027-01-01,2027-01-26,2027-08-15,2027-10-02}
      PRICING_REFRESH_CRON: "${PRICING_REFRESH_CRON:-0 0 * * * *}"
      # Requests from the web app arrive through Nginx; trust its X-Forwarded-For so the per-IP rate limits see the real
      # client. (The prod profile sets this too. Anyone who can reach port 8080 directly could spoof the header, so in a real
      # deployment only the proxy may be able to reach the app.)
      SERVER_FORWARD_HEADERS_STRATEGY: framework
      # Switches used by the load tests (load-tests/README.md); the defaults keep normal behaviour.
      PAYMENTS_FAKE: "${PAYMENTS_FAKE:-false}"
      RATE_LIMIT_ENABLED: "${RATE_LIMIT_ENABLED:-true}"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8080/api/v1/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  # The web app (frontend/): static files served by Nginx, which also forwards /api to the app so the browser only talks
  # to one origin. Open http://localhost:5173 (the port the backend's FRONTEND_URL and CORS defaults already name).
  frontend:
    build: ./frontend
    image: airstay-frontend:local
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "${FRONTEND_PORT:-5173}:80"
    restart: unless-stopped

  # A fake mail server with a web inbox: every e-mail the notification service sends lands here, never on the Internet.
  # Web UI: http://localhost:8025 (SMTP on 1025 is only reachable by the other containers).
  mailpit:
    image: axllent/mailpit:v1.33.1
    ports:
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 20

  # A second, independent deployable (notification-service/). It reads booking events from Kafka and e-mails the
  # guest through Mailpit. It never calls the API; if it is stopped, bookings are unaffected and its events wait in Kafka.
  notification-service:
    build: ./notification-service
    image: airstay-notification-service:local
    depends_on:
      kafka:
        condition: service_healthy
      redis:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      REDIS_HOST: redis
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:8081/actuator/health"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 40s
    restart: unless-stopped

  # Forwards Stripe test-mode webhooks to the app. Copy the "whsec_..." secret it prints into .env
  # as STRIPE_WEBHOOK_SECRET, then restart the app.
  stripe-cli:
    image: stripe/stripe-cli:v1.55.11
    profiles: ["stripe"]
    depends_on:
      app:
        condition: service_healthy
    command: ["listen", "--events", "checkout.session.completed,checkout.session.async_payment_succeeded,checkout.session.expired,checkout.session.async_payment_failed", "--forward-to", "http://app:8080/api/v1/webhook/payment"]
    environment:
      STRIPE_API_KEY: ${STRIPE_SECRET_KEY:-}

volumes:
  pgdata:
  kafkadata:
